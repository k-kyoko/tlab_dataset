[project]
name = "qstr-dataset"
version = "0.1.0"
description = "データ・適用コード・結果を束ねるプロジェクト。数値 backend (qstr_diversity) と厳密 backend (genmag_exact) の結果を突き合わせる"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kyoko Kusano" }]
dependencies = [
    "qstr-diversity",
    "genmag-exact",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "tables>=3.10",
    "jupyterlab>=4.3",
    "ipywidgets>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "nbstripout>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qstr_dataset"]

# 2つのライブラリは兄弟ディレクトリを editable 参照する。
# この3つを兄弟に置き続けること（~/Develop/{qstr_diversity,genmag_exact,qstr_dataset}）。
[tool.uv.sources]
qstr-diversity = { path = "../qstr_diversity", editable = true }
genmag-exact = { path = "../genmag_exact", editable = true }
